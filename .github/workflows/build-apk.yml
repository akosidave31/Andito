name: Build APK

# This runs entirely on GitHub's servers. Nothing here needs to run on your
# phone — Termux only needs to get the code (including the android/ folder,
# see SETUP.md) pushed to GitHub. Trigger manually from the Actions tab, or
# just push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu build machines already ship with the Android SDK
      # installed (at $ANDROID_HOME) with its licenses accepted. The old
      # android-actions/setup-android step re-downloaded Google's tools on
      # every build and started failing mid-download, so we use the
      # preinstalled SDK directly instead. Gradle fetches any missing
      # platform/build-tools version on its own.
      - name: Use preinstalled Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "No Android SDK found on this runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate app icon and splash screen
        # Builds every Android icon/splash size from the source images in
        # assets/. Runs here on GitHub because it needs the `sharp` image
        # library, which doesn't install on Termux. If this step ever fails,
        # the APK still builds (with the default icon) and the step shows red.
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andito-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
