name: Build APK

# This runs entirely on GitHub's servers. Nothing here needs to run on your
# phone — Termux only needs to get the code (including the android/ folder,
# see SETUP.md) pushed to GitHub. Trigger manually from the Actions tab, or
# just push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu build machines already ship with the Android SDK
      # installed (at $ANDROID_HOME) with its licenses accepted. The old
      # android-actions/setup-android step re-downloaded Google's tools on
      # every build and started failing mid-download, so we use the
      # preinstalled SDK directly instead. Gradle fetches any missing
      # platform/build-tools version on its own.
      - name: Use preinstalled Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "No Android SDK found on this runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate app icon and splash screen
        # Builds every Android icon/splash size from the source images in
        # assets/. Runs here on GitHub because it needs the `sharp` image
        # library, which doesn't install on Termux. If this step ever fails,
        # the APK still builds (with the default icon) and the step shows red.
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      # Android only installs an update over an existing app if both are
      # signed with the same key. Without this step, every GitHub build
      # makes a brand-new random debug key, so phones refuse to update and
      # the app has to be uninstalled first, which wipes all store data.
      # Gradle signs debug builds with ~/.android/debug.keystore, so we put
      # the permanent key there. The key itself lives only in the
      # ANDROID_DEBUG_KEYSTORE_B64 repository secret (and Dave's private
      # copy), never in the repo.
      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_DEBUG_KEYSTORE_B64 secret is missing. Refusing to build with a random key, because phones couldn't update to it without uninstalling (which wipes store data)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error::The signing key in ANDROID_DEBUG_KEYSTORE_B64 couldn't be read. Re-create it with the exact keytool command from the setup steps."; exit 1; }

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andito-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
